<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FuSa Agent Framework</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b23; --panel2: #1c232e; --line: #2a3441;
    --text: #d7dee8; --dim: #7d8a9b; --accent: #5ba8f5;
    --c-not_started: #48566a; --c-blocked: #d9a441; --c-drafted: #5ba8f5;
    --c-gate_passed: #3fbcb2; --c-gate_failed: #e05555; --c-rework: #e08a3c;
    --c-reviewed: #52c47c; --c-disabled: #333c48;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
  header { display: flex; align-items: center; gap: 14px; padding: 12px 20px;
           border-bottom: 1px solid var(--line); background: var(--panel);
           position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .5px; }
  header h1 span { color: var(--accent); }
  .badge { font-size: 11px; padding: 2px 9px; border-radius: 10px;
           border: 1px solid var(--line); color: var(--dim); }
  .badge.dry { color: var(--c-blocked); border-color: var(--c-blocked); }
  .badge.live { color: var(--c-reviewed); border-color: var(--c-reviewed); }
  #verdict { cursor: pointer; }
  .badge.rel { color: var(--c-reviewed); border-color: var(--c-reviewed); }
  .badge.norel { color: var(--c-gate_failed); border-color: var(--c-gate_failed); }
  .spacer { flex: 1; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--line);
           border-radius: 6px; padding: 6px 14px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0b1420; font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  #board { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
           gap: 14px; padding: 18px 20px 200px; align-items: start; }
  .phase { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .phase h2 { font-size: 11px; color: var(--dim); margin: 2px 4px 10px;
              text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
  .card { background: var(--panel2); border: 1px solid var(--line); border-left: 4px solid var(--c-not_started);
          border-radius: 7px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; position: relative; }
  .card:hover { border-color: var(--accent); }
  .card .wp { font-weight: 700; font-size: 13px; }
  .card .aid { color: var(--dim); font-size: 11px; }
  .card .req { color: var(--dim); font-size: 10px; margin-top: 3px; }
  .card .st { font-size: 10px; margin-top: 5px; display: inline-block; padding: 1px 7px;
              border-radius: 8px; background: var(--bg); }
  .card .kind { position: absolute; top: 7px; right: 9px; font-size: 9px; color: var(--dim);
                text-transform: uppercase; letter-spacing: 1px; }
  .card button.mini { padding: 2px 9px; font-size: 11px; margin-top: 6px; display: block; }
  .card.disabled { opacity: .5; border-left-style: dashed; cursor: default; }
  .card.pulse { animation: pulse 1.1s infinite; }
  @keyframes pulse { 50% { border-color: var(--accent); box-shadow: 0 0 8px 0 #5ba8f540; } }

  #logwrap { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel);
             border-top: 1px solid var(--line); z-index: 6; }
  #logbar { display: flex; gap: 10px; align-items: center; padding: 6px 20px; color: var(--dim);
            font-size: 12px; cursor: pointer; user-select: none; }
  #logdot { width: 8px; height: 8px; border-radius: 50%; background: var(--c-not_started); }
  #logdot.on { background: var(--c-reviewed); animation: pulse 1.1s infinite; }
  #log { height: 160px; overflow-y: auto; padding: 4px 20px 12px; white-space: pre-wrap;
         font-size: 12px; display: none; }
  #log.open { display: block; }
  #log .err { color: var(--c-gate_failed); }
  #log .warn { color: var(--c-blocked); }
  #log .ok { color: var(--c-reviewed); }

  #drawer { position: fixed; top: 0; right: -640px; width: 620px; max-width: 92vw; bottom: 0;
            background: var(--panel); border-left: 1px solid var(--line); z-index: 10;
            transition: right .18s ease; display: flex; flex-direction: column; }
  #drawer.open { right: 0; box-shadow: -18px 0 40px #0009; }
  #drawer header { position: static; }
  #drawer .body { overflow-y: auto; padding: 14px 20px; flex: 1; }
  #drawer pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
                padding: 12px; overflow-x: auto; font-size: 12px; white-space: pre-wrap; }
  .finding { border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; margin: 6px 0; font-size: 12px; }
  .finding .sev { text-transform: uppercase; font-size: 10px; letter-spacing: 1px; margin-right: 8px; }
  .sev.blocker { color: var(--c-gate_failed); } .sev.major { color: var(--c-rework); } .sev.minor { color: var(--dim); }
  .kv { color: var(--dim); font-size: 12px; margin: 4px 0; }
  .drop { border: 2px dashed var(--line); border-radius: 10px; padding: 26px 14px; text-align: center;
          color: var(--dim); cursor: pointer; margin: 8px 0 16px; }
  .drop.hover, .drop:hover { border-color: var(--accent); color: var(--text); }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); margin: 18px 0 6px; }
  input[type=text], input[type=password], select {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 10px; font: inherit; width: 100%; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  table { border-collapse: collapse; font-size: 12px; }
  td, th { border: 1px solid var(--line); padding: 4px 9px; text-align: left; }
</style>
</head>
<body>
<header>
  <h1>Fu<span>Sa</span> Agent Framework <span style="color:var(--dim);font-size:12px">ISO 26262 / SEooC</span></h1>
  <span id="mode" class="badge">…</span>
  <span id="model" class="badge">…</span>
  <span id="verdict" class="badge" title="release validation — click for blockers">…</span>
  <span class="spacer"></span>
  <button id="settings" title="LLM backend: provider, model, API key">⚙ LLM</button>
  <button id="templates" title="Download a blank input template">⬇ Templates</button>
  <button id="inputs">⬆ Inputs</button>
  <button id="report">Validation report</button>
  <button id="reportx" title="Excel results workbook">⬇ Excel report</button>
  <button id="aspice">ASPICE coverage</button>
  <button id="runall" class="primary">▶ Run all</button>
</header>

<div id="board"></div>

<div id="logwrap">
  <div id="logbar"><span id="logdot"></span><span id="logstate">idle</span>
    <span class="spacer"></span><span>orchestrator log ▾</span></div>
  <div id="log" class="open"></div>
</div>

<div id="drawer">
  <header><h1 id="d-title"></h1><span class="spacer"></span><button id="d-close">✕</button></header>
  <div class="body" id="d-body"></div>
</div>

<script>
const PHASES = {1:"1 · Concept & Requirements", 2:"2 · System Analysis", 3:"3 · Hardware Analysis",
                4:"4 · Software Analysis", 5:"5 · Quantitative Analysis",
                6:"6 · Safety Solution", 7:"7 · Verification & Validation"};
const $ = s => document.querySelector(s);
const api = (p, opt) => fetch(p, opt).then(r => r.ok ? r.json() : r.json().then(e => Promise.reject(e)));
let logNext = 0, agents = [];

function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

async function loadMeta(){
  const m = await api("/api/meta");
  $("#mode").textContent = m.dry_run ? "DRY RUN — no model calls" : "LIVE";
  $("#mode").className = "badge " + (m.dry_run ? "dry" : "live");
  $("#model").textContent = m.provider + " · " + m.model;
}

$("#settings").onclick = async () => {
  const s = await api("/api/settings");
  $("#d-title").textContent = "LLM backend";
  $("#d-body").innerHTML = `
    <div class="kv">Backend used by the authoring and review agents. The API key is held in server
      memory only — it is never written to disk, and never sent back to the browser. It can also come
      from the environment: ${Object.entries(s.providers).map(([k,p]) => `${k}: ${p.key_env.join(" / ")}`).join(" · ")}.</div>
    <h3>Provider</h3>
    <select id="s-provider">${Object.entries(s.providers).map(([k,p]) =>
      `<option value="${k}" ${k===s.provider?"selected":""}>${esc(p.label)}</option>`).join("")}</select>
    <h3>Model</h3>
    <input type="text" id="s-model" value="${esc(s.model)}" spellcheck="false">
    <h3>API key ${s.api_key_set ? '<span style="color:var(--c-reviewed)">· configured ✓</span>' : '<span style="color:var(--c-blocked)">· not set</span>'}</h3>
    <input type="password" id="s-key" placeholder="${s.api_key_set ? "leave blank to keep the current key" : "sk-ant-… / xai-… / gsk_… / sk-… (OpenAI) / AIza… (Gemini)"}">
    <div style="display:flex; gap:10px; margin-top:14px">
      <button id="s-save" class="primary">Save</button>
      <button id="s-test">Test connection</button>
    </div>
    <div id="s-out" class="kv" style="margin-top:10px"></div>`;
  $("#s-provider").onchange = () =>
    $("#s-model").value = s.providers[$("#s-provider").value].default_model;
  $("#s-save").onclick = async () => {
    try {
      const r = await api("/api/settings", {method:"POST", headers:{"content-type":"application/json"},
        body: JSON.stringify({provider: $("#s-provider").value, model: $("#s-model").value,
                              api_key: $("#s-key").value})});
      $("#s-key").value = "";
      $("#s-out").textContent = `saved — ${r.provider} · ${r.model}` + (r.api_key_set ? " · key configured" : " · no key yet");
      loadMeta();
    } catch(e){ $("#s-out").textContent = "rejected — " + (e.detail || "error"); }
  };
  $("#s-test").onclick = async () => {
    $("#s-out").textContent = "testing…";
    const r = await api("/api/settings/test", {method:"POST"});
    $("#s-out").textContent = r.ok ? ("✓ backend reachable" + (r.note ? " — " + r.note : ` — replied “${r.reply}”`))
                                   : "✗ " + r.error;
  };
  $("#drawer").classList.add("open");
};

let lastReport = null;
async function loadVerdict(){
  try {
    lastReport = await api("/api/report");
    const ok = lastReport.verdict === "RELEASABLE";
    $("#verdict").textContent = ok ? "RELEASABLE" : `NOT RELEASABLE · ${lastReport.reasons.length}`;
    $("#verdict").className = "badge " + (ok ? "rel" : "norel");
  } catch(e){ /* server restarting */ }
}
$("#verdict").onclick = () => {
  if (!lastReport) return;
  $("#d-title").textContent = "Release validation — " + lastReport.verdict;
  $("#d-body").innerHTML = lastReport.reasons.length
    ? `<h3>Release blockers</h3>` + lastReport.reasons.map(r =>
        `<div class="finding"><span class="sev major">block</span>${esc(r)}</div>`).join("")
    : `<p class="kv">All work products reviewed, gates passed, no pending markers, metric targets met.</p>`;
  $("#drawer").classList.add("open");
};
$("#templates").onclick = () => {
  $("#d-title").textContent = "Input templates";
  $("#d-body").innerHTML = `
    <div class="kv">Blank templates for the two files the chain takes as input. Fill one in and drop it
      on ⬆ Inputs — it is validated, saved to input/ and the chain re-runs.</div>
    <h3>Safety requirements (.xlsx)</h3>
    <div class="kv">23 columns across the lifecycle, with a Description sheet and dropdowns.
      Requirement IDs fill themselves in as you type a row, and any left blank or misspelt
      (<code>sr-1</code>) are made canonical on import — an id never rejects the upload.</div>
    <a href="/api/template/requirements"><button class="primary" style="width:100%;margin-top:6px">
      ⬇ safety-requirements-template.xlsx</button></a>
    <h3>FMEDA failure modes (.csv)</h3>
    <div class="kv">element, mode, lam_fit, category (SPF/MPF/S/RF), dc, safety_mechanism —
      the input the metrics tool reads for SPFM / LFM / PMHF.</div>
    <a href="/api/template/fmeda"><button style="width:100%;margin-top:6px">
      ⬇ fmeda-failure-modes-template.csv</button></a>
    <h3>Command line</h3>
    <pre>python -m fusa template                 # requirements .xlsx
python -m fusa template --kind fmeda    # failure modes .csv</pre>`;
  $("#drawer").classList.add("open");
};

$("#inputs").onclick = async () => {
  $("#d-title").textContent = "Inputs";
  let files = [];
  try { files = await api("/api/input"); } catch(e){}
  $("#d-body").innerHTML = `
    <a href="/api/template/requirements"><button style="width:100%">⬇ Download safety-requirements template (.xlsx)</button></a>
    <div class="drop" id="drop">⬆ drop your file here, or click to choose<br>
      <span class="kv">.xlsx — filled safety-requirements template (23 columns, see its Description sheet; Requirement IDs may be left blank — they are auto-assigned)<br>
      .csv — FMEDA failure modes (element, mode, lam_fit, category, dc, safety_mechanism)<br>
      the file is validated, saved to input/, and the whole chain runs automatically</span></div>
    <input type="file" id="csvfile" accept=".csv,.xlsx,text/csv" style="display:none">
    <h3>input/</h3>` +
    files.map(f => `<div class="finding">${esc(f.name)}
      <span class="kv">${f.size} B · ${esc(f.modified)}</span></div>`).join("");
  const drop = $("#drop"), inp = $("#csvfile");
  drop.onclick = () => inp.click();
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("hover"); };
  drop.ondragleave = () => drop.classList.remove("hover");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("hover");
                       if (e.dataTransfer.files[0]) uploadCsv(e.dataTransfer.files[0]); };
  inp.onchange = () => inp.files[0] && uploadCsv(inp.files[0]);
  $("#drawer").classList.add("open");
};
async function uploadCsv(file){
  logLine("[ui] uploading " + file.name + " …");
  const isXlsx = file.name.toLowerCase().endsWith(".xlsx");
  const url = isXlsx ? "/api/input/requirements" : "/api/input/fmeda";
  const type = isXlsx ? "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" : "text/csv";
  try {
    const r = await api(url, {method:"POST", body: file, headers: {"content-type": type}});
    logLine(`[ui] saved ${r.saved} (${r.rows} rows${r.fusa_relevant !== undefined ? `, ${r.fusa_relevant} FuSa-relevant -> SYS-REQ` : ""}) — chain started`);
    (r.id_notes || []).forEach(n => logLine("[ui]   id fixed     " + n));
    $("#drawer").classList.remove("open");
  } catch(e){
    (Array.isArray(e.detail) ? e.detail : [e.detail || "upload failed"])
      .forEach(d => logLine("[ui] upload rejected — " + d));
  }
}
$("#reportx").onclick = () => window.open("/report.xlsx", "_blank");

$("#report").onclick = async () => {
  try { const r = await api("/api/report", {method:"POST"}); logLine("[ui] validation report → " + r.markdown_path); }
  catch(e){ logLine("[ui] " + (e.detail || "report error")); }
  window.open("/report", "_blank");
};

async function refresh(){
  loadVerdict();
  agents = await api("/api/agents");
  const byPhase = {};
  for (const a of agents) (byPhase[a.phase] ??= []).push(a);
  const board = $("#board"); board.innerHTML = "";
  for (const ph of Object.keys(byPhase).sort((a,b)=>a-b)){
    const col = document.createElement("div"); col.className = "phase";
    col.innerHTML = `<h2>${PHASES[ph] || "phase " + ph}</h2>`;
    for (const a of byPhase[ph]) col.appendChild(card(a));
    board.appendChild(col);
  }
}

function card(a){
  const el = document.createElement("div");
  const running = $("#logdot").classList.contains("on");
  el.className = "card" + (a.enabled ? "" : " disabled");
  el.style.borderLeftColor = a.enabled ? `var(--c-${a.status})` : "var(--c-disabled)";
  el.innerHTML = `
    <span class="kind">${a.kind}</span>
    <div class="wp">${esc(a.work_product)}</div>
    <div class="aid">${esc(a.id)}</div>
    ${a.requires.length ? `<div class="req">⇠ ${a.requires.join(", ")}</div>` : ""}
    <span class="st" style="color:var(--c-${a.enabled ? a.status : "disabled"})">
      ${a.enabled ? a.status.replace("_"," ") : "declared (disabled)"}</span>`;
  if (a.enabled){
    const b = document.createElement("button");
    b.className = "mini"; b.textContent = "▶ run"; b.disabled = running;
    b.onclick = e => { e.stopPropagation(); runAgent(a.id); };
    el.appendChild(b);
    el.onclick = () => openWp(a);
  }
  return el;
}

async function runAgent(id){
  try { await api("/api/run/" + id, {method:"POST"}); } catch(e){ logLine("[ui] " + (e.detail || "error")); }
}
$("#runall").onclick = async () => {
  try { await api("/api/run-all", {method:"POST"}); } catch(e){ logLine("[ui] " + (e.detail || "error")); }
};

function logLine(l){
  const div = document.createElement("div");
  div.textContent = l;
  if (/error|ERROR|FAILED/i.test(l)) div.className = "err";
  else if (/warning|BLOCKED|REWORK|pending/i.test(l)) div.className = "warn";
  else if (/REVIEWED|passed|===/.test(l)) div.className = "ok";
  $("#log").appendChild(div); $("#log").scrollTop = 1e9;
}

let wasRunning = false;
async function poll(){
  try {
    const l = await api("/api/logs?since=" + logNext);
    l.lines.forEach(logLine); logNext = l.next;
    $("#logdot").className = l.running ? "on" : "";
    $("#logstate").textContent = l.running ? "running…" : "idle";
    if (l.lines.length || wasRunning !== l.running) await refresh();
    wasRunning = l.running;
  } catch(e){ /* server restarting */ }
  setTimeout(poll, 700);
}

async function openWp(a){
  $("#d-title").textContent = a.work_product + " — " + a.title;
  const body = $("#d-body");
  body.innerHTML = `<div class="kv">agent ${esc(a.id)} · clauses ${a.clauses.join(", ") || "—"} · method ${a.method || "—"}</div>`;
  $("#drawer").classList.add("open");
  let wp;
  try { wp = await api("/api/wp/" + a.work_product); }
  catch(e){ body.innerHTML += `<p class="kv">not generated yet — run the agent first.</p>`; return; }
  const rec = wp.record || {};
  if (rec.gate) body.innerHTML += `<h3>Gate</h3>
    ${rec.gate.passed ? '<span class="st" style="color:var(--c-reviewed)">passed</span>' : ''}
    ${rec.gate.errors.map(e=>`<div class="finding"><span class="sev blocker">error</span>${esc(e)}</div>`).join("")}
    ${rec.gate.warnings.map(w=>`<div class="finding"><span class="sev major">warn</span>${esc(w)}</div>`).join("")}
    ${rec.gate.pending.map(p=>`<div class="finding"><span class="sev minor">pending</span>${esc(p)}</div>`).join("")}`;
  if (rec.review) body.innerHTML += `<h3>Independent review — ${esc(rec.review.verdict)}</h3>` +
    rec.review.findings.map(f=>`<div class="finding"><span class="sev ${f.severity}">${f.severity}</span>${esc(f.id)}: ${esc(f.description)}${f.returns_to ? ` <span class="kv">→ ${esc(f.returns_to)} (rework)</span>` : ""}</div>`).join("");
  if (wp.metrics) body.innerHTML += `<h3>Metrics</h3><pre>${esc(wp.metrics)}</pre>`;
  body.innerHTML += `<h3>Work product</h3><pre>${esc(wp.content)}</pre>`;
}
$("#d-close").onclick = () => $("#drawer").classList.remove("open");

$("#aspice").onclick = async () => {
  const a = await api("/api/aspice");
  $("#d-title").textContent = "ASPICE base-practice coverage";
  $("#d-body").innerHTML = mdTable(a.table);
  $("#drawer").classList.add("open");
};
function mdTable(md){
  const rows = md.trim().split("\n").filter(r => !/^\|[-| ]+\|$/.test(r));
  return "<table>" + rows.map((r,i) => "<tr>" + r.split("|").slice(1,-1)
    .map(c => `<t${i?"d":"h"}>${esc(c.trim())}</t${i?"d":"h"}>`).join("") + "</tr>").join("") + "</table>";
}
$("#logbar").onclick = () => $("#log").classList.toggle("open");

loadMeta(); refresh(); poll();
</script>
</body>
</html>
