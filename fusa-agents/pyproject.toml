[project]
name = "fusa-agents"
version = "0.1.0"
description = "Agentic framework for ISO 26262 / SEooC safety work products: one agent per work product, one home per knowledge type."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
ui = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
fusa = "fusa.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fusa*"]

[tool.setuptools.package-data]
"fusa.ui" = ["static/*"]
